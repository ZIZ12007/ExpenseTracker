<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Expenza">
  <title>Expenza</title>
  <g fill="none" stroke="#7C3AED" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- the spine of the E -->
    <path d="M6 10 L6 39.5" />
    <!-- the top arm of the E -->
    <path d="M6 10 C14 9.6 24 9.2 32.5 9.2" />
    <!-- the middle arm of the E, which the Z starts from -->
    <path d="M5 24.6 C18 24.4 34 24.1 49.5 24" />
    <!-- the bottom arm of the E -->
    <path d="M6 39.5 C13 39.5 21 39.6 29.5 39.7" />
    <!-- the diagonal of the Z, falling to the left -->
    <path d="M49.5 24 C42 34 35 45 28 54.5" />
    <!-- the bottom stroke of the Z -->
    <path d="M28 54.5 C38 54.3 49 54.3 59.5 54.4" />
  </g>
</svg>
