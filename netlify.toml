[build]
  # --include=dev is required: Netlify sets NODE_ENV=production for the build,
  # which makes npm skip devDependencies (vite, tailwindcss) and the build
  # fails with "vite: not found".
  command = "npm --prefix frontend/expense-tracker install --include=dev && npm --prefix frontend/expense-tracker run build"
  publish = "frontend/expense-tracker/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
